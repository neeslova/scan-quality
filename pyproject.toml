[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-quality"
version = "0.1.0"
description = "Система оценки качества сканов документов с распознаванием дефектов"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

# Локальное окружение: Windows, CPU. Подготовка данных, CV-метрики, инференс, приложение.
# Обучение живёт в Colab и ставится отдельно: pip install -e ".[train]"
dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pymupdf>=1.23",
    "scipy>=1.10",
    "pyyaml>=6.0",
    # gradio 4.x падает на pydantic >= 2.10 при генерации API-схемы
    # (TypeError: argument of type 'bool' is not iterable). Gradio 5 требует Python >= 3.10.
    "pydantic>=2.7,<2.10",
    "pandas>=2.0",
    "gradio>=4.0",
    # gradio 4.x (последняя ветка под Python 3.9) импортирует HfFolder,
    # удалённый в huggingface_hub 1.0 — без пина приложение не стартует.
    "huggingface-hub>=0.25,<1.0",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    # Нужен именно экспорту: torch.onnx.export падает без него. В инференсе не
    # участвует — там onnxruntime из базовых зависимостей.
    "onnx>=1.15",
    "torchvision>=0.16",
    "timm>=0.9",
    "albumentations>=1.3",
    "augraphy>=8.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
]
ocr = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
]
# Текстовое объяснение отчёта. Отдельным extra намеренно: базовая установка
# обязана работать без сети и без этого пакета.
# anthropic 1.x требует Python >= 3.10, а целевой здесь 3.9 (решение №9) —
# пин снимается только вместе с переездом на 3.10+, как у gradio и pydantic.
explain = [
    "anthropic>=0.40,<1.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "black>=24.3",
]

[project.scripts]
scanq-app = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]

[tool.ruff.lint.pyupgrade]
# pydantic вычисляет аннотации в рантайме, а `X | Y` (PEP 604) появился только в 3.10.
# Дженерики-builtins (`list[str]`) на 3.9 уже работают, а Optional/Union оставляем как есть.
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
