# Оверлей под `data/Data iz tg` — сканы и фотографии документов, собранные
# вручную и разложенные по папкам good/bad. Накладывается поверх configs/base.yaml:
#   python -m src.cli --input "data/Data iz tg" --corpus configs/corpora/tg.yaml
#
# Чем корпус отличается от Tobacco. Он русскоязычный, разнородный по способу
# съёмки (есть и планшетные сканы, и фотографии с телефона) и — главное —
# намеренно несбалансированный: примерно половина страниц отобрана как плохие.
# Последнее важно помнить при калибровке якорей: `calibrate_anchors` ставит их
# по перцентилям, исходя из того, что типичная страница скорее хорошая, а здесь
# это неверно по построению. Якоря сюда надо считать по классам из golden-набора,
# а не по общему распределению.

ocr:
  # Корпус русский. С английским алфавитом `garbage_ratio` объявил бы мусором
  # всю кириллицу и выдал бы около единицы на любой, даже идеальной странице.
  # Латиница оставлена: в документах регулярно встречаются марки, номера и
  # латинские вставки, и без неё они пошли бы в мусор.
  languages: [ru, en]

# Судья включён: корпус собран вручную из открытых источников, и отправка
# страницы во внешний сервис здесь допустима. Для Tobacco это решается отдельно —
# там документы с настоящими именами и адресами (см. решение №2 в src/explain.py).
judge:
  enabled: true

# Якоря шкалы, пересчитанные по этому корпусу (31.08.2026).
#
# Якоря из `base.yaml` подобраны на Tobacco — офисные сканы около 200 dpi с
# крупным шрифтом, — и на `Data iz tg` они дают вырожденные скоры. Хуже всех
# было `low_resolution`: якорь стоял на `line_height_px` good=30 / bad=13, тогда
# как здесь медиана высоты строки равна 12 пикселям, и КАЖДАЯ страница получала
# ровно 1.000. Она одна и насыщала правило «один минус худший дефект»: 186
# страниц из 199 объявлялись браком, ROC-AUC падал до 0.508.
#
# Пересчитано по перцентилям корпуса, из сохранённых сырых метрик прогона:
#   python -m src.metrics.calibrate_anchors --reports reports/tg_baseline.jsonl
#
# Не по классам из эталона, хотя разметка есть: у половины меток медианы
# совпадают между классами (skew, glare, cropped дают 0 и там и там), и якоря
# по классам выродились бы. Замер обоих способов — в reports/tg_learned.md.
cv:
  scores:
    blur: { metric: tenengrad_norm, good: 3.176, bad: 0.17 }
    shadow: { metric: shadow_frac, good: 0.0, bad: 0.2218 }
    skew: { metric: skew_abs_deg, good: 0.0, bad: 1.785 }
    cropped: { metric: border_ink_frac, good: 0.0, bad: 0.6595 }
    low_resolution: { metric: line_height_px, good: 13.4, bad: 4.0 }
    streaks: { metric: streak_energy, good: 0.0018, bad: 0.0481 }
    glare: { metric: glare_cluster_frac, good: 0.0, bad: 0.1028 }
    low_contrast: { metric: ink_paper_gap, good: 155.0, bad: 54.15 }
    noise: { metric: noise_sigma, good: 0.5008, bad: 8.014 }

verdict:
  # `low_resolution` считается и попадает в отчёт, но вердикт не решает.
  #
  # Причина не в калибровке, и перекалибровка её не лечит: на этом корпусе
  # медиана `line_height_px` одинакова у хороших и плохих страниц — 12 пикселей
  # там и там, — а ROC-AUC метки колеблется около 0.5 при любых якорях. Хорошие
  # и плохие сканы здесь сняты с одинаковым размером текста, и разрешение просто
  # не является той осью, по которой они различаются.
  #
  # Из `labels` метка не убрана намеренно: список дефектов зафиксирован ТЗ и
  # общий для всех корпусов, а на Tobacco с его микрофильмами она осмысленна.
  # Убрана она только из решения — иначе правило «хоть одна метка выше порога»
  # отдаёт вердикт метке, которая ничего не знает.
  ignore: [low_resolution]
  # Обученное сведение вместо правила «один минус худший дефект».
  # Получено из reports/tg_baseline.jsonl и эталона:
  #   python -m src.models.from_metrics --reports reports/tg_baseline.jsonl   #       --golden data/labeled/golden_tg.jsonl --save models/verdict_tg.joblib
  # Честная 5-fold: ROC-AUC 0.770 против 0.505 у правила. Модель обучена на этом
  # корпусе и на другой без переобучения не переносится.
  model: models/verdict_tg.joblib
