# Оверлей под `data/Data iz tg` — сканы и фотографии документов, собранные
# вручную и разложенные по папкам good/bad. Накладывается поверх configs/base.yaml:
#   python -m src.cli --input "data/Data iz tg" --corpus configs/corpora/tg.yaml
#
# Чем корпус отличается от Tobacco. Он русскоязычный, разнородный по способу
# съёмки (есть и планшетные сканы, и фотографии с телефона) и — главное —
# намеренно несбалансированный: примерно половина страниц отобрана как плохие.
# Последнее важно помнить при калибровке якорей: `calibrate_anchors` ставит их
# по перцентилям, исходя из того, что типичная страница скорее хорошая, а здесь
# это неверно по построению. Якоря сюда надо считать по классам из golden-набора,
# а не по общему распределению.

ocr:
  # Корпус русский. С английским алфавитом `garbage_ratio` объявил бы мусором
  # всю кириллицу и выдал бы около единицы на любой, даже идеальной странице.
  # Латиница оставлена: в документах регулярно встречаются марки, номера и
  # латинские вставки, и без неё они пошли бы в мусор.
  languages: [ru, en]

# Судья включён: корпус собран вручную из открытых источников, и отправка
# страницы во внешний сервис здесь допустима. Для Tobacco это решается отдельно —
# там документы с настоящими именами и адресами (см. решение №2 в src/explain.py).
judge:
  enabled: true
