# Оверлей под YeniseiGovReports-TD — архивные сканы губернаторских отчётов
# XVIII–XIX вв., кириллица, дореформенная орфография, много рукописных вставок.
# Накладывается поверх configs/base.yaml:
#   python -m src.app --corpus configs/corpora/yenisei.yaml
#
# Откалибровано по 150 случайным сканам:
#   python -m src.metrics.calibrate_anchors --data data/raw/yenisei/images --limit 150
#
# Зачем отдельный файл. Якоря — это шкала относительно корпуса, а не абсолютные
# физические пороги. Самый наглядный случай — cropped: в base.yaml (офисные сканы
# Tobacco) чернила на границе кадра означают срезанный текст, здесь же граница
# кадра почти всегда содержит край листа и корешок переплёта, и это норма съёмки,
# а не дефект документа. Отделить одно от другого без детекции края страницы
# нельзя, поэтому шкала сдвигается: см. журнал решений, №23 и №24.

cv:
  scores:
    blur: { metric: tenengrad_norm, good: 1.04, bad: 0.112 }
    # Тень от переплёта здесь обычна: разворот подсвечен неравномерно по определению.
    shadow: { metric: shadow_frac, good: 0.002, bad: 0.232 }
    skew: { metric: skew_abs_deg, good: 0.0, bad: 1.955 }
    # good = 0.15, а не 0: в Tobacco столько чернил на границе — уже обрез,
    # здесь — типичный разворот, подрезанный по листу.
    cropped: { metric: border_ink_frac, good: 0.153, bad: 0.919 }
    # Разрешение в корпусе гуляет в 14 раз (от 417x672 до 6002x4418), отсюда
    # такой размах. У Tobacco здесь 30 -> 13: там сканы мельче и однороднее.
    low_resolution: { metric: line_height_px, good: 46.0, bad: 4.0 }
    low_contrast: { metric: ink_paper_gap, good: 136.4, bad: 49.8 }
    # Фактура старой бумаги даёт постоянный фоновый уровень шума.
    noise: { metric: noise_sigma, good: 0.153, bad: 12.112 }
    streaks: { metric: streak_energy, good: 0.021, bad: 0.042 }
    # glare не калибруется: пересвета в корпусе нет вовсе (планшетный скан,
    # а не фотосъёмка), все значения нули и перцентили вырождаются.
    # Остаётся физический якорь из base.yaml.
