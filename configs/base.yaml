# Единая точка правды: метки, пути, гиперпараметры, пороги.
# Магических чисел в коде быть не должно — всё сюда.

labels:
  - blur
  - glare
  - shadow
  - skew
  - cropped
  - low_resolution
  - low_contrast
  - noise
  - streaks
  - unreadable

# Кто выдаёт какую метку. Не замысел, а результат замера от 27.08.2026 на 90
# реальных val-страницах (решения №39-40, reports/cnn_vs_baseline_val.md):
# CV-слой и сеть ошибаются на непересекающихся метках, и каждую надо брать
# у сильнейшего. Гибрид даёт macro-AP 0.746 против 0.665 у CV и 0.526 у сети.
#
# Метка должна встречаться ровно один раз: два источника на одну метку означали
# бы необъявленный арбитраж, а пропуск — метку, которую никто не считает.
sources:
  # AP 0.50-1.00 против 0.14-0.68 у сети. Детерминированы и объяснимы.
  cv: [blur, glare, shadow, skew, cropped, low_resolution, streaks]
  # Единственные две, где CV-слой не выдаёт значения вовсе: корпус битональный,
  # а на битональном скане контраст и шум не измеримы (решение №21).
  cnn: [low_contrast, noise]
  # Выводится из распознавания по построению (решение №7). Голова сети её тоже
  # предсказывает, но отбирать по ней лучшую эпоху нельзя: в train три примера
  # на восемь тысяч страниц, поэтому в макро-среднее она не входит.
  ocr: [unreadable]

# Пути относительно корня репозитория.
paths:
  raw: data/raw
  labeled: data/labeled
  synthetic: data/synthetic
  splits: data/splits
  models: models
  reports: reports
  # Сеть для инференса. Отсутствие файла — рабочее состояние, а не ошибка:
  # без него система считает по CV-метрикам и OCR, просто без меток сети.
  onnx_model: models/quality.onnx

data:
  patch_size: 384
  target_dpi: 300
  # Чем считать dpi, если в файле нет метаданных: "a4" — вывести из размера страницы
  # (длинная сторона = 297 мм), "none" — не масштабировать вовсе.
  dpi_fallback: a4
  # Приводить к target_dpi только вниз. Апскейл скана 200 dpi до 300 замыливает
  # края букв интерполяцией и создаёт размытие, которого в исходнике не было.
  allow_upscale: false
  grid: { rows: 9, cols: 6 }
  # Как схлопывать предсказания по патчам в один скор на страницу.
  aggregation:
    local: [glare, shadow, cropped, streaks] # max
    global: [blur, skew, low_resolution, low_contrast, noise, unreadable] # mean

# ---------------------------------------------------------------------------
# CV-метрики (спринт С1). Это baseline без обучения — с ним сравниваем CNN.
# ---------------------------------------------------------------------------
cv:
  # Пересвет: пиксель ярче glare_threshold, кластеры мельче min_cluster_frac
  # (доля площади страницы) считаем шумом, а не бликом.
  glare_threshold: 245
  glare_min_cluster_frac: 0.0005
  # Белая бумага сама по себе ярче 245, поэтому одного порога мало: блик — это ещё и
  # потеря информации. Требуем, чтобы внутри окна не осталось никакой фактуры.
  glare_flat_window_frac: 0.02 # окно локальной дисперсии, доля меньшей стороны
  glare_flat_std: 3.0 # ниже этой σ участок считаем выбитым в белое
  glare_min_excess: 8 # насколько блик должен быть ярче собственного уровня бумаги

  # Локальная бинаризация чернил: окно как доля меньшей стороны и насколько пиксель
  # должен быть темнее локального среднего. Локальный порог вместо Оцу — потому что
  # тень сдвигает глобальный порог и затемнённая половина страницы уходит в «текст».
  ink_block_frac: 0.03
  ink_offset: 10
  # Открытие против зерна бумаги, доля меньшей стороны. Фиксированные 3x3 не
  # справляются с фактурой старой бумаги: пятна и потемневшие края проходят порог
  # и растягивают бокс текста на весь кадр.
  ink_denoise_frac: 0.0015

  # Обрез документа. Меряем не «нет полей», а «штрихи рассечены границей кадра»:
  # скан, подрезанный ровно по листу, полей не имеет при сохранном документе.
  crop_band_frac: 0.005 # ширина полосы вдоль края, доля меньшей стороны
  # Компоненту, растянутую вдоль стороны больше этой доли, считаем рамкой сканера
  # или тенью переплёта и в обрез не засчитываем — это отдельный дефект.
  crop_frame_span_frac: 0.8

  # Битональный скан (факс, микрофильм, режим Ч/Б на МФУ): почти всё в двух пиках
  # у 0 и 255. Разрыв бумага/чернила там всегда максимален, а шум обнулён самой
  # бинаризацией — значит low_contrast и noise на такой странице неизмеримы,
  # и честнее отметить их как неприменимые, чем выдать уверенный ноль.
  bitonal_mid_low: 40
  bitonal_mid_high: 215
  bitonal_max_mid_frac: 0.05

  # Тень ищем по фону: сильно размываем страницу и смотрим, где он темнее медианы.
  shadow_rel_threshold: 0.82
  shadow_background_frac: 0.06 # ядро размытия = доля меньшей стороны

  # Перекос: сначала грубый проход, потом точный вокруг найденного угла.
  skew_max_angle: 15.0
  skew_coarse_step: 1.0
  skew_fine_step: 0.1
  skew_work_height: 800 # даунскейл перед поиском угла, иначе очень долго

  # Патч считаем информативным, если на нём есть текст: иначе резкость мерить не на чем.
  min_ink_frac: 0.01
  # Строка на горизонтальном профиле — ряд, где чернил больше этой доли ширины.
  line_min_row_ink_frac: 0.02
  # Участок профиля выше этой доли высоты страницы строкой не считается: это
  # остатки рамок и слитые блоки. Без такого предела тёмный край скана давал
  # чернила в каждой строке профиля, и «высота строки» равнялась высоте листа.
  line_max_height_frac: 0.25
  # Сглаживание профиля перед поиском строк, доля высоты страницы. Без него на
  # фактурной бумаге профиль дрожит вокруг порога и одна строка разваливается
  # на несколько коротких участков.
  line_profile_smooth_frac: 0.002
  # Полосы: ширина сглаживания профиля колонок, доля ширины страницы.
  streak_smooth_frac: 0.02

  # Сырую метрику переводим в скор 0..1 линейной интерполяцией между двумя якорями.
  # good — значение типичной страницы, bad — хвост распределения.
  # Направление выводится само: good может быть как больше bad, так и меньше.
  #
  # Откалибровано по 250 случайным сканам Tobacco3482:
  #   python -m src.metrics.calibrate_anchors --data data/raw/tobacco3482/data --limit 250
  # Абсолютные значения не универсальны (Tenengrad зависит от гарнитуры, кегля и dpi),
  # поэтому под другой корпус блок пересчитывается заново. Это шкала подозрительности
  # для предразметки, а не пороги вердикта — пороги считаются по PR-кривым в С6.
  scores:
    # tenengrad_norm = Tenengrad / (разрыв бумага-чернила)². Делить обязательно:
    # блёклая печать роняет градиент так же, как расфокус, и без нормировки
    # low_contrast неотличим от blur.
    blur: { metric: tenengrad_norm, good: 0.988, bad: 0.459 }
    shadow: { metric: shadow_frac, good: 0.0, bad: 0.064 }
    skew: { metric: skew_abs_deg, good: 0.0, bad: 1.555 }
    cropped: { metric: border_ink_frac, good: 0.0, bad: 0.621 }
    # Высота строки в РАБОЧЕМ разрешении. Пока загрузчик растягивал сканы вверх,
    # приходилось смотреть на пиксели исходного файла (решение №15) — после запрета
    # апскейла (№20) скан ниже целевого dpi остаётся мелким сам по себе, и рабочая
    # высота строки уже честно показывает потерю разрешения. Вариант source_*
    # при этом раздувался у больших сканов, которые мы уменьшали.
    # Корпусная статистика сошлась с физикой: p60 = 30 px, p5 = 13 px, а в таксономии
    # порог нечитаемости стоял на ~15 px из независимых соображений.
    low_resolution: { metric: line_height_px, good: 30.0, bad: 13.0 }
    streaks: { metric: streak_energy, good: 0.0, bad: 0.078 }

    # Ниже — якоря, которые на Tobacco откалибровать нельзя, оставлены прежними.
    # Они заданы в физических единицах, а не в единицах корпуса, и на полутоновых
    # сканах (Yenisei) осмысленны.
    # glare: в Tobacco пересвета нет вовсе — планшет и микрофильм, а не фотосъёмка,
    # все значения нули, перцентили вырождаются.
    glare: { metric: glare_cluster_frac, good: 0.0, bad: 0.04 }
    # low_contrast и noise: все страницы Tobacco битональные, обе метрики там
    # неизмеримы и в распределение не попадают (см. cv.bitonal_*).
    low_contrast: { metric: ink_paper_gap, good: 110.0, bad: 30.0 }
    noise: { metric: noise_sigma, good: 2.0, bad: 12.0 }

# ---------------------------------------------------------------------------
# OCR-слой (спринт С3). Отсюда берётся метка unreadable.
# ---------------------------------------------------------------------------
ocr:
  engine: easyocr # easyocr | tesseract
  # Язык под корпус: Tobacco англоязычный, для Yenisei в оверлее стоит ru.
  languages: [en]
  # OCR по уменьшенной копии: на 300 dpi он не точнее, а времени ест втрое больше.
  work_side: 1600
  # Слово с уверенностью ниже порога считаем нераспознанным и в среднюю
  # уверенность не берём — иначе шум из пустых полей тянет её вниз.
  min_confidence: 0.30
  # Символы вне алфавита языка плюс этот набор считаются мусором. Всплеск мусора
  # при живой уверенности — типичная картина плохого скана: движок «узнаёт»
  # что-то в грязи и уверенно выдаёт кракозябры.
  extra_chars: "0123456789.,;:!?()[]{}-–—«»\"'/\\%№@#&*+=<>_$ \t\n"
  # Метка unreadable выводится из трёх сигналов, берётся худший.
  unreadable:
    mean_confidence: { good: 0.85, bad: 0.35 }
    # У EasyOCR распознаватель с закрытым алфавитом и физически не может выдать
    # символ вне языка: на Tobacco этот сигнал был ровно 0.00 на всех страницах.
    # Оставлен для Tesseract, у которого алфавит открытый.
    garbage_ratio: { good: 0.05, bad: 0.40 }
    # Тот же смысл, но выживает при закрытом алфавите: «rn1lI» собран из легальных
    # букв и всё равно не слово.
    # Порог смягчён: печать поверх текста, подпись или штамп портят треть
    # токенов, и при good 0.15 такой скан объявлялся нечитаемым целиком. Сама
    # локальность помехи теперь ловится сигналом readable_share.
    nonword_ratio: { good: 0.35, bad: 0.80 }
    # Сколько текста страницы прочитано уверенно и осмысленно. Главный сигнал:
    # он отвечает «сколько я могу прочесть», а не «есть ли испорченное место».
    readable_share: { good: 0.70, bad: 0.20 }
  # Меньше этого числа распознанных блоков — считать нечего, метку не выдаём.
  min_boxes: 5
  # Выше этого скора метка unreadable становится True. Обучение бинарное, градацию
  # приходится терять — сам скор сохраняется в LabelRecord.derived для анализа.
  unreadable_threshold: 0.5

# ---------------------------------------------------------------------------
# Разметка (спринт С2)
# ---------------------------------------------------------------------------
labeling:
  # Метки, которые человек не ставит: unreadable выводится автоматически по OCR (С3).
  auto_labels: [unreadable]
  # Выше этого скора черновой чекбокс предзаполняется галочкой. Порог намеренно
  # низкий: пропустить дефект дороже, чем снять лишнюю галочку.
  suggest_threshold: 0.30
  # Сколько страниц отбираем на ручную разметку и как.
  # 300, а не 800 из раздела 7.2: основной объём обучения всё равно синтетический,
  # а реальные размеченные страницы нужны прежде всего под val и отложенный тест.
  # Разметчик продолжает с места остановки, так что цель можно поднять позже.
  sample_total: 300
  # Доля честной случайной выборки. Остальное добирается по подозрительности,
  # чтобы редкие дефекты вообще попали в набор. Смешиваем осознанно: чистый
  # рандом даёт правдивые частоты, но 2-3 примера на редкую метку; чистый отбор
  # по CV учит модель только тем дефектам, которые CV и так умеет ловить.
  random_share: 0.5
  sample_seed: 42

split:
  # Сплит по ДОКУМЕНТАМ, не по страницам: у страниц одного дела одна бумага
  # и один прогон сканера, случайное перемешивание завышает метрики на 10-15%.
  # Доли необычные, и это осознанно. Делится ТОЛЬКО ручная разметка, а train
  # набирается в основном синтетикой поверх чистых эталонов (С4). Отдавать
  # дефицитные реальные страницы в train незачем — важнее, чтобы отложенный тест
  # был достаточно большим: при 300 размеченных обычные 70/15/15 дали бы тест
  # в 45 страниц, а в разделе 7.2 заложено 150-200.
  ratios: { train: 0.2, val: 0.3, test: 0.5 }
  seed: 42
  # Как из имени файла получить id документа:
  #   bates7 — первые 7 цифр (Bates-номера Tobacco: подряд идущие = соседние страницы)
  #   stem   — имя файла целиком, одна страница = один документ
  #   parent — имя родительской папки
  document_id: bates7

# ---------------------------------------------------------------------------
# Синтетика (спринт С4). Деградируем ЧИСТЫЕ РЕАЛЬНЫЕ сканы, а не рисуем страницы
# с нуля: так сохраняется домен — та же бумага, тот же шрифт, тот же прогон
# сканера, — а метки известны по построению.
# ---------------------------------------------------------------------------
synth:
  seed: 42
  # 8000, а не 10000: строгих эталонов в корпусе всего 241 (Tobacco — архив плохих
  # сканов, у медианной страницы худший скор дефекта 0.70). Больше — и повторов
  # на эталон станет столько, что сеть выучит сами страницы.
  target_total: 8000
  # Сколько дефектов может сойтись на одной странице. Больше трёх — уже каша,
  # по которой невозможно понять, что именно выучила сеть.
  max_defects_per_image: 3
  # Контроль частот из раздела 7.4: реже этой доли метка не выучивается,
  # и pos_weight её не вытягивает.
  min_label_share: 0.15
  # Базовая вероятность применить дефект. Для меток, не добравших min_label_share,
  # поднимается автоматически.
  base_probability: 0.22
  # Сила дефекта: 0 — едва заметно, 1 — предел диапазона ниже. Слабее 0.3
  # не генерируем: такие дефекты и человек на разметке не отметил бы.
  severity: { min: 0.3, max: 1.0 }
  # Отбор эталонов под деградацию.
  reference:
    # Скор любого дефекта выше — страница не эталон.
    max_defect_score: 0.25
    # Сколько эталонов взять. Меньше — синтетика начнёт повторять одни и те же
    # страницы и сеть выучит их, а не дефекты.
    count: 900
  # Диапазоны параметров: [минимум при severity=0, максимум при severity=1].
  params:
    blur_gauss: { ksize: [3, 21] }
    blur_motion: { length: [5, 31] }
    glare: { radius_frac: [0.06, 0.26], softness_frac: [0.2, 0.5] }
    shadow: { depth: [0.2, 0.6], width_frac: [0.12, 0.45] }
    skew: { angle_deg: [1.0, 7.0] }
    cropped: { cut_frac: [0.03, 0.16] }
    low_resolution: { scale: [0.6, 0.22] }
    low_contrast: { factor: [0.7, 0.15] }
    noise: { sigma: [4.0, 24.0], salt_prob: [0.0, 0.012] }
    streaks: { count: [3, 14], depth: [18, 70], width: [1, 4] }

# ---------------------------------------------------------------------------
# Обучение на патчах (спринт С5)
# ---------------------------------------------------------------------------
dataset:
  # Сколько патчей берём с одной страницы за эпоху.
  patches_per_page: 4
  # На валидации патчей больше и они детерминированы: вердикт по странице
  # собирается максимумом по патчам, и одним патчем блик в углу не поймать.
  val_patches_per_page: 8
  # Патч без текста бесполезен: резкость и шум на пустом поле бумаги не измеримы,
  # и сеть на таких патчах учит фактуру бумаги, а не дефект.
  min_ink_frac: 0.01
  # Сколько попыток найти патч с текстом, прежде чем взять любой.
  max_patch_attempts: 12
  # Локальная метка ставится патчу, только если он реально накрывает область
  # дефекта. Иначе патч из чистого угла получил бы метку блика из центра страницы.
  # Два порога по ИЛИ: доля патча под маской ИЛИ доля маски внутри патча.
  min_mask_overlap: 0.15
  # Тонкий дефект не может накрыть 15% квадрата 384x384: у `streaks` и `cropped`
  # маска — линии и кромка, и по первому порогу они не проходили никогда.
  min_mask_share: 0.02
  # Лёгкая аугментация яркости и контраста. Геометрию не трогаем: перекос и
  # обрез — сами по себе метки, и случайный поворот их бы подделывал.
  brightness: 0.12
  contrast: 0.12
  workers: 4

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.2

train:
  epochs: 30
  batch_size: 32
  lr: 3.0e-4
  optimizer: adamw
  scheduler: cosine
  seed: 42
  pos_weight: auto # "auto" — считать по частотам в train, либо список из 10 чисел
  # Потолок для pos_weight. Без него метка с тремя примерами на восемь тысяч
  # страниц получает вес 2686, и её слагаемое съедает всю функцию потерь:
  # на первом же прогоне train-потеря была 0.52, а val-потеря 23.7.
  # Так вышло с `unreadable`: синтетика её не ставит (она выводится из OCR),
  # а в реальных train её всего три штуки.
  pos_weight_max: 50.0
  # Сколько страниц взять, чтобы оценить долю положительных ПАТЧЕЙ для pos_weight.
  # Полный проход означал бы декодирование всех восьми тысяч страниц до первой
  # же эпохи; выборки хватает, дальше третьего знака точность не нужна.
  pos_weight_sample: 400

verdict:
  # Правило вердикта из раздела 4 плана. Пороги ОБЩИЕ для всех меток и такими
  # остаются: сравнимость обеспечивают якоря ниже, а не разные пороги на метку.
  #
  # Подобраны на странице целиком (С7, решение №45), и потому СТРОЖЕ опорных
  # точек шкалы 0.30/0.60. Причина в объединении: правило требует, чтобы ни одна
  # из девяти меток не превысила порог, и целевой полноты 0.85 на метку хватает,
  # чтобы чистая страница почти наверняка споткнулась хоть обо что-то.
  #
  # Связывающее ограничение — ноль страниц с тремя дефектами, прошедших как
  # `good` (раздел 4: пропустить плохой скан дороже всего). Из пар, которые ему
  # удовлетворяют, берётся самая мягкая: на 0.50/0.75 такая страница впервые
  # проходит. На val при 0.45/0.70 ошибочно отвергается одна чистая страница
  # из тридцати против четырёх при 0.40/0.65. Три тяжёлые страницы, ушедшие при
  # этом из `bad` в `acceptable`, не пропущены — они помечены на просмотр.
  tau_low: 0.45
  tau_high: 0.70
  tau_unreadable: 0.50
  # Якоря приводят скор метки к общей шкале: 0 в точке `good`, 1 в точке `bad`.
  # Без них скоры трёх источников несравнимы, и один порог 0.5 даёт то, что дал
  # на замере: у `blur` точность 1.000 при полноте 0.080. Считаются
  # `python -m src.models.calibrate` в файл configs/thresholds.yaml, который
  # накладывается оверлеем. Пусто — значит скор идёт в правило как есть.
  anchors: {}

# Текстовое объяснение отчёта через внешний API. Строго опционально: это
# декоратор над готовым результатом, а не источник вердикта (решение №2).
# Выключено по умолчанию — система обязана работать без сети.
explain:
  enabled: false
  model: claude-opus-5
  # Три-четыре предложения. Специально мало: это пересказ готовых чисел,
  # а не рассуждение, и длинный ответ тут был бы водой.
  max_tokens: 1000
  timeout_s: 30

# Как подбираются якоря. Асимметрия раздела 4 живёт здесь: пропустить плохой скан
# дороже, чем отклонить хороший, поэтому целевая полнота выше целевой точности.
calibrate:
  # Опорные точки ШКАЛЫ метки. Именно в них попадают рабочие точки по PR-кривой,
  # и именно поэтому они отвязаны от verdict.tau_*: иначе выходит круг — якоря
  # строятся относительно порога, а лучший порог подбирается по якорям. Эти два
  # числа фиксированы и означают «шкала метки устроена вот так»; где по этой
  # шкале резать страницу — отдельное решение уровнем выше.
  anchor_low: 0.30
  anchor_high: 0.60
  # Целевая полнота в точке anchor_low: поймать почти все дефекты.
  target_recall: 0.85
  # tau_high: «бесспорно плохо», страница становится `bad`. Тоже задано полнотой,
  # а не точностью: полнота монотонна по порогу, и порядок двух точек тем самым
  # гарантирован по построению. Через целевую точность вторая точка у хорошо
  # разделимой метки уезжала НИЖЕ первой, и шкала схлопывалась в ступеньку
  # шириной 0.003 — так вышло у shadow, skew и cropped на первом прогоне.
  confident_recall: 0.50
  # Метки, по которым план требует recall >= 0.95 отдельно.
  recall:
    blur: 0.95
    unreadable: 0.95
  # Меньше положительных примеров — не калибруем вовсе: подгонка по трём
  # страницам это не калибровка, а видимость её.
  min_support: 8
